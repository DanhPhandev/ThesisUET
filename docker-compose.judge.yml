# Optional standalone Judge0 (only needed to run and grade code)
# docker compose -f docker-compose.judge.yml up -d
services:
  judge0-db:
    image: postgres:13
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_local_only
    volumes:
      - judge_db_data:/var/lib/postgresql/data
  judge0-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - judge_redis_data:/data
  judge0-server:
    image: judge0/judge0:1.13.1
    privileged: true
    ports:
      - "127.0.0.1:2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
  judge0-workers:
    image: judge0/judge0:1.13.1
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
volumes:
  judge_db_data:
  judge_redis_data:
